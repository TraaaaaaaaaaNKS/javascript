<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aula 52</title>
</head>
<body>
    <h1>Calculadora</h1>
    <div id="caixa" class="caixa">
        <div id="p1">
            <p>Digite dois valores:</p>
            <div id="numero">
                <input type="number" class="num" id="n1">
                <input type="number" class="num" id="n2">
                <button id="soma">+</button>
                <button id="subtracao">-</button>
                <button id="multiplicacao">*</button>
                <button id="divisao">/</button>
            </div>
            <div id="res"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
