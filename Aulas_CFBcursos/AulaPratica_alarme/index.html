<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aula Prática</title>
</head>
<body>
    <div id="timer" class="timer">
        <div id="data_hora">
            <div id="div_data">00/00/0000</div>
            <div id="div_relogio">00:00:00</div>
        </div>
        <div id="def_alarme" class="def_alarme">
            <label id="hora_alarme">Hora do Alarme:</label>
            <label>Tempo do Alarme(Segundos)</label>
        </div>
        <input type="number" value="0" id="tmp_alarme" min="0">
        <div id="comandos">
            <button id="btn_ativar">Ativar</button>
            <button id="btn_parar">Parar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
