<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sinal de trânsito</title>
</head>
<body>
    <header>
        <h1>Sinal de trânsito</h1>
    </header>
    <main>
        <div id="farol">
            <div id="Vermelho"></div>
            <div id="Amarelo" ></div>
            <div id="Verde"></div>
        </div>
    </main>

    <article>
        <p>Clique em um dos botões para ativar o sinal de trânsito:</p>
    </article>

    <div id="botoes">
        <div id="BotaoRed">
            <button onclick="Vermelho()">Acionar</button>
        </div>
        <div id="BotaoYellow">
            <button onclick="Amarelo()">Acionar</button>
        </div>
        <div id="BotaoGreen"
        ><button onclick="Verde()">Acionar</button>
        </div>
    </div>

    <script src="ambiente.js"></script>
</body>
</html>
