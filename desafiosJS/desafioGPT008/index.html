<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de produtos</title>
</head>
<body>
    <header>
        <h1>Cadastro de Produtos </h1>
        <h2>Mercado LTDA</h2>
    </header>
    <div class="container">
        <section>
            <h2>Adiconar Produto</h2>
                <div class="cadastro" id="cadastro">
                    <label for="produto">Produto:</label><input type="text" id="produto" name="produto">
                    <label for="preco">Preço:</label><input type="number" id="preco">
                    <button id="btn_cadastrar">Cadastrar</button>
                </div>
        </section>
        <div id="lista"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
