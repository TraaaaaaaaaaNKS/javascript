<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analisador de Números</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section id="info">
        <div>
            <label for="numero">Número entre (1 e 100): <input type="number" id="numero"></label>
            <button id="add" onclick="adicionar()">Adicionar</button>
        </div>
        <div>
            <select name="numsel" id="numsel" size="10"></select>
            <div id="resumo">
                <button id="finish" onclick="finalizar()">Finalizar</button>
            </div>
        </div>
    </section>
    <footer>
        &copy; CursoemVídeo
    </footer>
    <script src="ambiente.js"></script>
</body>
</html>
