<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Super Contador</title>
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div>
            <p><label for="inicio">Início: </label><input type="number" name="inicio" id="inicio" required></p> 
            <p><label for="fim">Fim: </label><input type="number" name="fim" id="fim" required></p> 
            <p><label for="passo">Passo: </label><input type="number" name="passo" id="passo" required> </p>
            <input type="button" value="Contar" onclick="Contar()">
        </div>
        <div id="contagem">
            Preparando a contagem...
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
