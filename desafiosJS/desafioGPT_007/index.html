<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de tarefas</title>
</head>
<body>
    <header>
        <h1>Lista de tarefas</h1>
    </header>
    <section>
        <div id="tarefas">
            Digite sua tarefa diária: <input type="text" id="inp_tarefa">
            <button id="btn_add">Adicionar</button>
        </div>
        <div id="painel_de_tarefas">
            <h2>Aqui estão suas tarefas diárias</h2>
            <div id="mostrar_tarefas">
                <div id="tarefa"></div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
