<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 001 JS</title>
    <style>
        body {
            background-color: rgba(0, 110, 255, 0.801);
            color: white;
            font-style: arial;
            font-size: 20px;

        }
        h1{
            color: rgba(251, 255, 0, 0.808);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
     var n1 = Number.parseFloat (window.prompt('Digite um número: '))
     var n2 = Number.parseFloat (window.prompt('Digite outro número: '))
     var soma = n1 + n2
     window.alert(`A soma entre ${n1} + ${n2} é igual a ${soma}`)
    </script>
</body>
</html>
